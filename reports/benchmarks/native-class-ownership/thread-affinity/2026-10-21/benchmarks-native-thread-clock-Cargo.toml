[package]
name = "rustdom-native-thread-clock"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux thread CPU clock for finite rustdom performance diagnostics"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "=0.2.189"
napi = { path = "../../third-party/napi", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.4"

[build-dependencies]
napi-build = "=2.4.2"

[workspace]
