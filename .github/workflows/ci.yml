name: Validate rustdom

on:
  push:
    branches: ['feature/**', main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run test:validation
      - run: npm run validate
      - run: npm run test:memory
      - run: npm run package
      - run: npm run test:package
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Fijar npm para validar Node 22
        if: runner.os == 'Linux'
        run: npm install --global npm@11.19.0
      - if: runner.os == 'Linux'
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - if: runner.os == 'Linux'
        run: npm run test:native-memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: reports/

  benchmark_shards:
    name: Benchmark shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    env:
      RUSTDOM_BENCHMARK_SHARD_COUNT: '4'
      RUSTDOM_BENCHMARK_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: node --test tests/benchmarks/*.spec.cjs
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-linux-${{ matrix.shard }}
          path: reports/benchmarks/

  benchmarks:
    needs: benchmark_shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every benchmark shard to succeed
        env:
          SHARD_RESULT: ${{ needs.benchmark_shards.result }}
        run: test "$SHARD_RESULT" = success
