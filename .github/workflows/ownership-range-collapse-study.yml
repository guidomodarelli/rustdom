name: Ownership con collapse nativo

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read
  checks: read

defaults:
  run:
    shell: bash

concurrency:
  group: ownership-range-collapse-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.event.action == 'labeled' && github.event.label.name == 'ownership-range-collapse-v1' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exigir una única activación y QA del SHA actual
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE_STUDY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir "$RUNNER_TEMP/range-study"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ownership-range-collapse-study.yml/runs?event=pull_request&per_page=100" --jq '.workflow_runs[] | select(.conclusion != "skipped") | .id' > "$RUNNER_TEMP/range-study/existing-runs.txt"
          node reports/benchmarks/native-class-ownership/current-ownership-consumption.cjs "$RUNNER_TEMP/range-study/existing-runs.txt" "$GITHUB_RUN_ID"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$RANGE_STUDY_SOURCE_COMMIT/check-runs?per_page=100" --jq '.check_runs[] | [.name, .conclusion] | @tsv' > "$RUNNER_TEMP/range-study/existing-checks.tsv"
          node <<'JS'
          const assert = require('node:assert/strict'); const fs = require('node:fs');
          const policy = require('./reports/benchmarks/native-class-ownership/range-collapse-study/constants/protocol.json');
          const checks = fs.readFileSync(`${process.env.RUNNER_TEMP}/range-study/existing-checks.tsv`, 'utf8').trim().split('\n').map((line) => line.split('\t'));
          for (const name of policy.requiredChecks) assert.ok(checks.some(([actual, conclusion]) => actual === name && conclusion === 'success'), `Range study: missing successful current check ${name}`);
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Conservar Node 22
        run: echo "RANGE_STUDY_NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conservar Node 24
        run: echo "RANGE_STUDY_NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - name: Extraer solo la preparación exacta ya autenticada y calificada
        run: python -B reports/benchmarks/native-class-ownership/range-collapse-study/extract.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/range-study/preparation" > "$RUNNER_TEMP/range-study/preparation.json"
      - name: Ejecutar una única secuencia completa en ambos Node
        timeout-minutes: 175
        env:
          RANGE_STUDY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          "$RANGE_STUDY_NODE24" reports/benchmarks/native-class-ownership/range-collapse-study/study.cjs --capture "$RUNNER_TEMP/range-study/preparation/range-collapse-packages" "$RUNNER_TEMP/range-study/capture" "$RANGE_STUDY_SOURCE_COMMIT" "$RANGE_STUDY_NODE22" "$RANGE_STUDY_NODE24" > "$RUNNER_TEMP/range-study/stdout.log" 2> "$RUNNER_TEMP/range-study/stderr.log"
          capture_status=$?
          printf '%s\n' "$capture_status" > "$RUNNER_TEMP/range-study/exit-code"
          exit "$capture_status"
      - name: Conservar todo el resultado y los parciales
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/range-study" ]; then
            tar -cJf "$RUNNER_TEMP/range-study.tar.xz" -C "$RUNNER_TEMP" range-study
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-range-collapse-${{ github.event.pull_request.head.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/range-study.tar.xz
