name: XMLSerializer performance

on:
  pull_request:
    paths:
      - '.github/workflows/xml-controller.yml'
      - 'reports/benchmarks/native-class-ownership/xml-history*.cjs'
      - 'reports/benchmarks/native-class-ownership/xml-history*.py'
      - 'reports/benchmarks/native-class-ownership/constants/xml-history.json'
      - 'reports/benchmarks/native-class-ownership/fixtures/xml-history-sources/**'
      - 'reports/benchmarks/native-class-ownership/xml-validation/**'
      - 'benchmarks/**'
      - 'reports/benchmarks/xml-serializer-controller/**'
      - 'src/**'
      - 'scripts/**'
      - 'third-party/napi/**'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.npmrc'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'tests/integration/read-dom-file.cjs'

permissions:
  contents: read

concurrency:
  group: xml-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node24:
    name: XMLSerializer Node 24
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      XML_CONTROLLER_ARCHIVE: reports/benchmarks/native-class-ownership/xml-validation/39697882498
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: checkpoint-066-reference-catalog
          path: .baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Verificar los contratos de selección y la evidencia original
        run: node --test reports/benchmarks/native-class-ownership/xml-history.spec.cjs
      - name: Exigir que las fuentes y la receta conserven evidencia XML
        run: node reports/benchmarks/native-class-ownership/xml-history.cjs --select .baseline "$XML_CONTROLLER_ARCHIVE"
      - name: Recalcular la evidencia XML conservada y respetar su decisión
        run: node reports/benchmarks/native-class-ownership/xml-history.cjs --verify .baseline "$XML_CONTROLLER_ARCHIVE"
