# Calificación histórica de un método/paquete consumido. No acredita la fuente de producción del PR.
# CI e inventory-qualification construyen y prueban el PR actual; ownership permanece bloqueado sin nueva aceptación.
name: Histórico — Núcleo prospectivo por proceso

on:
  pull_request:
    paths:
      - '.github/workflows/combined-process-study-contracts.yml'
      - '.github/workflows/ownership-combined-process-study.yml'
      - 'reports/benchmarks/native-class-ownership/combined-process-study/**'
      - 'reports/benchmarks/native-class-ownership/range-combined-packages/**'
      - 'reports/benchmarks/native-class-ownership/range-combined-study/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/combined-process-study-contracts.yml'
      - '.github/workflows/ownership-combined-process-study.yml'
      - 'reports/benchmarks/native-class-ownership/combined-process-study/**'
      - 'reports/benchmarks/native-class-ownership/range-combined-packages/**'
      - 'reports/benchmarks/native-class-ownership/range-combined-study/**'

permissions:
  contents: read

jobs:
  contracts:
    name: Contratos prospectivos Node ${{ matrix.node }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.14.1']
    env:
      METHOD: reports/benchmarks/native-class-ownership/combined-process-study
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4196c496187c88c92304516287a7e644659a8536 # Fuente original del método consumido; no es producción actual.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/benchmarks/native-class-ownership/combined-process-study/
      - name: Autenticar dependencias acotadas
        timeout-minutes: 5
        run: |
          proof_directory="$RUNNER_TEMP/combined-process-contracts"
          mkdir -p "$proof_directory"
          printf 'PROOF=%s\n' "$proof_directory" >> "$GITHUB_ENV"
          printf 'RUSTDOM_COMBINED_PACKAGE_ROOT=%s/combined-process-package/combined-range-packages\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUSTDOM_COMBINED_DERIVED_ROOT=%s/combined-process-derived\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 -B "$METHOD/tools/configure-checkout.py" "$GITHUB_WORKSPACE" > "$proof_directory/checkout.stdout.log" 2> "$proof_directory/checkout.stderr.log"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verificar SDK y extraer el paquete fijo
        timeout-minutes: 5
        run: |
          node "$METHOD/tools/runtime.cjs" '${{ matrix.node }}' > "$PROOF/runtime.json"
          python3 -B reports/benchmarks/native-class-ownership/range-combined-packages/extract.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/combined-process-package" > "$PROOF/extraction.stdout.log" 2> "$PROOF/extraction.stderr.log"
      - name: Derivar el sampler actual sin ejecutarlo
        timeout-minutes: 5
        run: |
          node "$METHOD/source.cjs" "$PROOF/source-manifest.json" > "$PROOF/source.stdout.log" 2> "$PROOF/source.stderr.log"
          python3 -B "$METHOD/derive.py" "$GITHUB_WORKSPACE" "$PROOF/source-manifest.json" "$RUSTDOM_COMBINED_DERIVED_ROOT" > "$PROOF/derivation.stdout.log" 2> "$PROOF/derivation.stderr.log"
      - name: Probar criterios y preparación real sin muestrear
        timeout-minutes: 5
        run: |
          set +e
          node --test "$METHOD/compare.spec.cjs" "$METHOD/preparation.spec.cjs" "$METHOD/worker.spec.cjs" "$METHOD/results.spec.cjs" "$METHOD/portable.spec.cjs" "$METHOD/study.spec.cjs" "$METHOD/publication.spec.cjs" "$METHOD/decision.spec.cjs" "$METHOD/activation.spec.cjs" > "$PROOF/tests.stdout.log" 2> "$PROOF/tests.stderr.log"
          validation_status=$?
          printf '%s\n' "$validation_status" > "$PROOF/tests.exit-code"
          exit "$validation_status"
      - name: Probar transporte y extracción históricos sin ejecutar código archivado
        timeout-minutes: 5
        run: |
          set +e
          python3 -B "$METHOD/transport.spec.py" > "$PROOF/transport.stdout.log" 2> "$PROOF/transport.stderr.log"
          validation_status=$?
          printf '%s\n' "$validation_status" > "$PROOF/transport.exit-code"
          exit "$validation_status"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 3
        with:
          name: combined-process-contracts-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/combined-process-contracts
          if-no-files-found: error
