name: Candidato combinado de Range en plataformas

on:
  pull_request:
    paths:
      - '.github/workflows/combined-range-candidate.yml'
      - 'reports/implementation/range-combined-candidate/**'
      - 'reports/implementation/static-range-candidate/**'
      - 'reports/benchmarks/native-class-ownership/range-collapse-candidate/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/combined-range-candidate.yml'
      - 'reports/implementation/range-combined-candidate/**'
      - 'reports/implementation/static-range-candidate/**'
      - 'reports/benchmarks/native-class-ownership/range-collapse-candidate/**'

permissions:
  contents: read

jobs:
  qualify:
    name: Candidato Range ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        node: ['22.12.0', '24.14.1']
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CANDIDATE_TOOLS: reports/implementation/range-combined-candidate/tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /reports/implementation/range-combined-candidate/
            /reports/implementation/static-range-candidate/
            /reports/benchmarks/native-class-ownership/range-collapse-candidate/
      - uses: actions/checkout@v4
        with:
          ref: f781c3b7549a86b6aa8b5a34d2bbb32038c315b7
          fetch-depth: 2
          path: .cache/combined-range-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /benchmarks/
            /tests/
            /types/
            /third-party/
            /reports/validation/native-class-ownership/ci-macos-timeout/fixture.json.gz
            /reports/validation/native-class-ownership/ci-macos-timeout/39686199408/fixture.json.gz
            /reports/validation/native-class-ownership/ci-windows-timeout/39894045206/comparison.json.gz
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Probar preparación y terminación de procesos reales
        run: |
          python -B "$CANDIDATE_TOOLS/prepare.spec.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache/combined-range-source" > "$RUNNER_TEMP/combined-prepare.stdout.log" 2> "$RUNNER_TEMP/combined-prepare.stderr.log"
          python -B "$CANDIDATE_TOOLS/command.spec.py" > "$RUNNER_TEMP/combined-command.stdout.log" 2> "$RUNNER_TEMP/combined-command.stderr.log"
      - name: Aplicar el patch y verificar identidades de fuentes
        run: python -B "$CANDIDATE_TOOLS/prepare.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache/combined-range-source" "$RUNNER_TEMP/combined-range-proof" > "$RUNNER_TEMP/combined-apply.stdout.log" 2> "$RUNNER_TEMP/combined-apply.stderr.log"
      - name: Construir y probar el candidato real
        timeout-minutes: 40
        run: python -B "$CANDIDATE_TOOLS/qualify.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache/combined-range-source" "$RUNNER_TEMP/combined-range-proof" "$(node -p 'process.execPath')" > "$RUNNER_TEMP/combined-qualify.stdout.log" 2> "$RUNNER_TEMP/combined-qualify.stderr.log"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: combined-range-${{ matrix.os }}-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/combined-*.log
            ${{ runner.temp }}/combined-range-proof/
            .cache/combined-range-source/dist/native-build.json
            .cache/combined-range-source/dist/rustdom.node
          if-no-files-found: error
