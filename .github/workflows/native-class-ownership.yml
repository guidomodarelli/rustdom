name: Native class ownership performance

on:
  pull_request:
    paths:
      - '.github/workflows/native-class-ownership.yml'
      - 'src/**'
      - 'third-party/napi/**'
      - 'reports/benchmarks/native-class-ownership/**'
      - 'benchmarks/**'
      - 'scripts/**'
      - 'tests/integration/read-dom-file.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.npmrc'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'

permissions:
  contents: read

concurrency:
  group: native-class-ownership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node22:
    name: Native class ownership Node 22
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      OWNERSHIP_ARCHIVE: reports/benchmarks/native-class-ownership/paired-inline/2026-10-22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: checkpoint-067-xml-serializer-controller
          path: .baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verificar contratos del gate con datos y fuentes reales
        run: node --test reports/benchmarks/native-class-ownership/hosted-experiment.spec.cjs reports/benchmarks/native-class-ownership/history.spec.cjs reports/benchmarks/native-class-ownership/source-preflight.spec.cjs reports/benchmarks/native-class-ownership/paired-main-evidence.spec.cjs reports/benchmarks/native-class-ownership/paired-study-configuration.spec.cjs reports/benchmarks/native-class-ownership/paired-inline.spec.cjs reports/benchmarks/native-class-ownership/ownership-evidence.spec.cjs
      - name: Recalcular el estudio C completo y exigir su aceptación
        run: node reports/benchmarks/native-class-ownership/ownership-evidence.cjs .baseline "$OWNERSHIP_ARCHIVE" > ownership-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-class-ownership-evidence-${{ github.event.pull_request.head.sha }}
          path: ownership-verification.json
