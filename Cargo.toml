[package]
name = "rustdom"
version = "0.1.0"
edition = "2024"
publish = false
description = "HTML5 parsing boundary for rustdom"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
html5ever = "0.39"
markup5ever_rcdom = "0.39"
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
selectors = "0.39"
cssparser = "0.37"
precomputed-hash = "0.1"
lru = "0.16"
unicode-case-mapping = "=1.0.0"
unicode-case-mapping-15 = { package = "unicode-case-mapping", version = "=0.5.0" }
xmlparser = "0.13.6"
indexmap = "2"

[build-dependencies]
napi-build = "2"

[patch.crates-io]
napi = { path = "third-party/napi" }

[profile.release]
lto = "thin"
codegen-units = 1
